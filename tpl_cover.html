<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{ --orange:#FF7500; --paper:#F5F6F8; --muted:#8C93A3; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{font-family:"Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
       background:#0B0D12;color:var(--paper);-webkit-font-smoothing:antialiased}

  .bg{position:absolute;inset:0;
    background:
      radial-gradient(820px 520px at 10% -12%, rgba(255,117,0,.20), transparent 62%),
      radial-gradient(760px 620px at 96% 106%, rgba(74,158,255,.16), transparent 64%),
      linear-gradient(160deg,#10131A 0%, #0B0D12 46%, #090B0F 100%)}
  .grid{position:absolute;inset:0;opacity:.22;
    background-image:
      linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(circle at 44% 42%, #000 36%, transparent 78%)}
  .noise{position:absolute;inset:0;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .vig{position:absolute;inset:0;
    background:radial-gradient(120% 95% at 42% 46%, transparent 40%, rgba(0,0,0,.60) 100%)}
  .topline{position:absolute;left:0;top:0;height:6px;width:100%;
    background:linear-gradient(90deg,#FF7500 0%,#FFA24A 34%,rgba(255,117,0,0) 74%)}

  .char{position:absolute;right:-6px;bottom:-18px;height:566px;z-index:2;
    filter:drop-shadow(0 22px 46px rgba(0,0,0,.70))}
  .charGlow{position:absolute;right:-60px;bottom:-60px;width:560px;height:560px;border-radius:50%;z-index:1;
    background:radial-gradient(circle, rgba(74,158,255,.26), transparent 66%)}

  .frame{position:absolute;inset:0;padding:54px 68px;display:flex;flex-direction:column;z-index:3}
  .eyebrow{display:flex;align-items:center;gap:14px;font-size:15px;letter-spacing:.3em;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 14px 2px rgba(255,117,0,.7)}

  .stage{flex:1;display:flex;flex-direction:column;justify-content:center}
  .row{display:flex;align-items:center;margin-bottom:22px}
  .num{font-size:104px;font-weight:900;letter-spacing:-.02em;line-height:.94;
    background:linear-gradient(180deg,#FFFFFF 0%,#D3D8E2 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));
    white-space:nowrap}
  .num.dim{background:linear-gradient(180deg,#7B8395 0%,#474E5E 100%);
    -webkit-background-clip:text;background-clip:text}
  .arrow{display:flex;align-items:center;margin:0 20px}
  .arrow .line{display:block;width:80px;height:9px;border-radius:4px;
    background:linear-gradient(90deg,rgba(255,117,0,.06),#FF7500)}
  .arrow .head{display:block;width:0;height:0;margin-left:-3px;
    border-left:24px solid #FF7500;border-top:16px solid transparent;border-bottom:16px solid transparent;
    filter:drop-shadow(0 0 14px rgba(255,117,0,.55))}

  .punch{font-size:84px;font-weight:900;letter-spacing:.02em;line-height:1.1;color:var(--orange);
    text-shadow:0 0 44px rgba(255,117,0,.45), 0 8px 26px rgba(0,0,0,.55)}
  .punch em{font-style:normal;color:#fff}

  .foot{display:flex;align-items:center;justify-content:space-between;width:62%;
    border-top:1px solid rgba(255,255,255,.10);padding-top:18px;
    font-size:15px;color:#9AA1B0;letter-spacing:.05em}
</style>
</head>
<body>
  <div class="bg"></div><div class="grid"></div><div class="noise"></div><div class="vig"></div><div class="topline"></div>
  {{CHAR}}
  <div class="frame">
    <div class="eyebrow"><span class="dot"></span><span>{{KICKER}}</span></div>
    <div class="stage">
      <div class="row">
        <div class="num">{{N1}}</div>
        <div class="arrow"><span class="line"></span><span class="head"></span></div>
        <div class="num dim">{{N2}}</div>
      </div>
      <div class="punch">{{PUNCH}}</div>
    </div>
    <div class="foot">
      <div>{{FOOT}}</div>
      <div>{{DATE}}</div>
    </div>
  </div>
</body>
</html>
